<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

        <title>TheNextIs – find the nearest café, ATM, pharmacy and more</title>
        <meta
            name="description"
            content="Find the nearest café, ATM, pharmacy, supermarket, toilet, playground and more around you. A free map search for places nearby, powered by OpenStreetMap."
        />
        <link rel="canonical" href="https://thenextis.com/" />

        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="icon" href="/icon.svg" type="image/svg+xml" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="TheNextIs" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <meta name="theme-color" content="#f8f4f0" />

        <link
            href="https://fonts.googleapis.com/css?family=Open+Sans:400,300"
            rel="stylesheet"
            type="text/css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/maplibre-gl@5.23.0/dist/maplibre-gl.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css"
        />
        <link rel="stylesheet" href="/app/app.css" />

        <meta property="og:type" content="website" />
        <meta property="og:site_name" content="TheNextIs" />
        <meta property="og:title" content="TheNextIs – find the nearest café, ATM, pharmacy and more" />
        <meta
            property="og:description"
            content="A free map search for places nearby, powered by OpenStreetMap."
        />
        <meta property="og:url" content="https://thenextis.com/" />
        <meta property="og:image" content="https://thenextis.com/og_image.png" />
        <meta property="og:image:width" content="1200" />
        <meta property="og:image:height" content="630" />
        <meta property="og:image:alt" content="TheNextIs map pin logo" />
        <meta name="twitter:card" content="summary_large_image" />

        <script type="application/ld+json">
            {
                "@context": "https://schema.org",
                "@type": "WebApplication",
                "name": "TheNextIs",
                "url": "https://thenextis.com/",
                "description": "Find the nearest café, ATM, pharmacy and more around you. A free map search for places nearby, powered by OpenStreetMap.",
                "applicationCategory": "TravelApplication",
                "operatingSystem": "Any",
                "browserRequirements": "Requires JavaScript",
                "image": "https://thenextis.com/og_image.png",
                "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" }
            }
        </script>
    </head>
    <body>
        <header class="visually-hidden">
            <h1>TheNextIs – find the nearest place around you</h1>
            <p>
                Search the map for the nearest café, restaurant, ATM, pharmacy, supermarket,
                bakery, toilet, drinking water, playground, charging station and more.
                TheNextIs uses free OpenStreetMap data and shows opening hours and contact details
                for places nearby.
            </p>
        </header>
        <span id="editOSM-button" style="display: none"></span>

        <div id="geocoder">
            <div id="geocoder-input-wrapper">
                <i class="fa fa-search" id="geocoder-search-icon"></i>
                <input
                    type="text"
                    id="geocoder-input"
                    placeholder="Search location..."
                    autocomplete="off"
                />
                <i class="fa fa-times" id="geocoder-clear-icon"></i>
            </div>
            <div id="geocoder-results"></div>
        </div>

        <div id="map"></div>

        <div id="feature-panel">
            <div id="feature-panel-handle"></div>
            <div id="feature-panel-header">
                <div id="feature-panel-title">
                    <div id="feature-panel-name"></div>
                    <div id="feature-panel-type"></div>
                </div>
                <div id="feature-panel-actions">
                    <button id="feature-panel-share" title="Share" style="display: none">
                        <i class="fa fa-share-alt"></i>
                        <i class="fa fa-check"></i>
                    </button>
                    <button id="feature-panel-close">
                        <i class="fa fa-times"></i>
                    </button>
                </div>
            </div>
            <div id="feature-panel-details"></div>
        </div>
        <div id="info-button" class="buttons"><i class="fa fa-info"></i></div>
        <button id="redo-search-button">Search this area</button>


        <script type="importmap">
            {
                "imports": {
                    "maplibre-gl": "https://esm.sh/maplibre-gl@5.23.0",
                    "opening_hours": "https://esm.sh/opening_hours@3.12.0"
                }
            }
        </script>
        <script type="module" src="/app/app.js"></script>

        <!-- Cloudflare Web Analytics -->
        <script
            defer
            src="https://static.cloudflareinsights.com/beacon.min.js"
            data-cf-beacon='{"token": "963e96e7b48244dfb08331900394dc80"}'
        ></script>
        <!-- End Cloudflare Web Analytics -->
    </body>
</html>
